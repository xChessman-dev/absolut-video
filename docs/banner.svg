<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Абсолют видео</title>
  <desc id="desc">Личная видеолента из галереи Android. Свайп, просмотр и избранное.</desc>
  <rect width="1280" height="480" rx="24" fill="#101520"/>
  <path d="M48 40h1184" stroke="#2c374d"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="100" fill="#B9CCFF" font-size="15" letter-spacing="3">ANDROID · LOCAL VIDEO PLAYER</text>
    <text x="60" y="202" fill="#FFFFFF" font-size="72" font-weight="700" letter-spacing="-2">Абсолют видео</text>
    <text x="64" y="259" fill="#BCC5D7" font-size="26">Твоя галерея. Один ролик на экран.</text>
    <text x="64" y="303" fill="#BCC5D7" font-size="22">Листай, отмечай и продолжай с того же места.</text>
    <rect x="64" y="358" width="148" height="42" rx="10" fill="#17233D"/>
    <text x="138" y="385" text-anchor="middle" fill="#B9CCFF" font-size="16">Без аккаунта</text>
    <rect x="224" y="358" width="148" height="42" rx="10" fill="#17233D"/>
    <text x="298" y="385" text-anchor="middle" fill="#B9CCFF" font-size="16">Без интернета</text>
    <text x="64" y="446" fill="#79869D" font-size="14">React Native / Expo / TypeScript</text>
  </g>
  <g transform="translate(949 70)">
    <rect width="232" height="340" rx="38" fill="#17233D" stroke="#B9CCFF" stroke-width="4"/>
    <rect x="16" y="53" width="200" height="221" rx="17" fill="#23324D"/>
